<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ride Companion"><style>
    .seg{fill:none;stroke-width:22;stroke-linecap:round}
    .ticks line{stroke:#5A5A66;stroke-width:4;stroke-linecap:round}
    @media (prefers-reduced-motion:no-preference){
      .anim .seg{stroke-dasharray:1 1;stroke-dashoffset:1;animation:fill 4.8s cubic-bezier(.3,.7,.2,1) infinite}
      .anim .s1{animation-delay:.12s}.anim .s2{animation-delay:.24s}.anim .s3{animation-delay:.36s}
      .anim .needle{animation:sweep 4.8s cubic-bezier(.3,.7,.2,1) infinite}
      .anim .wheel{animation:spin .6s linear infinite}
      .anim .lines{animation:dash 4.8s ease-in-out infinite}
    }
    .needle{transform-origin:256px 256px;transform:rotate(70deg)}
    @keyframes fill{0%{stroke-dashoffset:1}35%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
    @keyframes sweep{0%{transform:rotate(-135deg)}30%{transform:rotate(118deg)}42%{transform:rotate(62deg)}50%,80%{transform:rotate(70deg)}100%{transform:rotate(-135deg)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes dash{0%,20%{opacity:0;transform:translateX(30px)}40%,80%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(-20px)}}
    </style><defs><radialGradient id="bg" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#1C1C24"/><stop offset="1" stop-color="#060608"/></radialGradient></defs>
